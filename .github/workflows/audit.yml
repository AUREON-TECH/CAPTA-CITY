name: CAPTA CITY Dependency Refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'feat/capta-city-ludo-online'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile
        run: npm install --package-lock-only
      - name: Verify audit
        run: npm audit --audit-level=moderate
      - name: Commit refreshed lockfile
        run: |
          if git status --porcelain package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh secure dependency lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
